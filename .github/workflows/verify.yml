name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete mobile gate
        run: npm run verify

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0

      - name: Start a clean local database and apply every migration
        run: supabase db start

      - name: Run database security tests
        run: >-
          docker exec -i supabase_db_oos_ops_system
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=on
          < supabase/tests/phase_2_rls.sql

      - name: Stop the local Supabase services
        if: always()
        run: supabase stop --no-backup
