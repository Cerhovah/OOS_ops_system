name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete mobile gate
        run: npm run verify

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.116.0

      - name: Start a clean local database and apply every migration
        run: supabase db start

      - name: Run database security tests
        run: >-
          docker exec -i supabase_db_oos_ops_system
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=on
          < supabase/tests/phase_2_rls.sql

      - name: Stop the local Supabase services
        if: always()
        run: supabase stop --no-backup
