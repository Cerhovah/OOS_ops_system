project_id = "oos_ops_system"

# Repository defaults for local/clean-database verification. Review hosted
# values individually; do not push this whole block over a production project.
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["oosops://auth/callback"]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[storage.vector]
enabled = false

[functions.ai-analysis]
verify_jwt = true
